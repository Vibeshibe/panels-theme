name: Validate theme example
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Hugo
        shell: bash
        run: |
          version="$(cat .hugo-version)"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl --fail --location --silent --show-error --output hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_${version}_linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_${version}_checksums.txt"
          expected="$(awk -v name="hugo_${version}_linux-amd64.tar.gz" '$2 == name {print $1}' checksums.txt)"
          test -n "$expected"
          printf '%s  hugo.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf hugo.tar.gz
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build generic example
        run: hugo --source exampleSite --themesDir ../.. --destination "${{ runner.temp }}/example-public" --minify --panicOnWarning
